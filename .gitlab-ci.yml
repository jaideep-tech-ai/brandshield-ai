# ── BrandShield AI — GitLab CI/CD Pipeline ──────────────────────────────────
# Enforces automated pre-publishing brand governance, trademark compliance,
# and WCAG accessibility standards before deployment.

stages:
  - compliance_audit
  - test
  - build

variables:
  BRANDSHIELD_URL: "https://brandshield-ai-five.vercel.app"
  BRANDSHIELD_ORG_SLUG: "nimbus-labs"

# ── Stage 1: Brand Governance & Compliance Gate ───────────────────────────────
brandshield-governance-audit:
  stage: compliance_audit
  image: curlimages/curl:8.5.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      echo "=== RUNNING BRANDSHIELD AI PRE-PUBLISHING GOVERNANCE AUDIT ==="
      echo "Project: $CI_PROJECT_PATH"
      echo "Commit:  $CI_COMMIT_SHA ($CI_COMMIT_REF_NAME)"
      echo "Author:  $CI_COMMIT_AUTHOR"

      # Sanitize commit message and title with correct escape order (backslash FIRST, then quotes)
      CLEAN_TITLE=$(printf '%s' "${CI_COMMIT_TITLE:-GitLab Commit}" | tr -d '\r\n' | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
      CLEAN_MSG=$(printf '%s' "${CI_COMMIT_MESSAGE:-Pre-publishing commit}" | tr '\r\n' '  ' | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
      if [ -z "$CLEAN_TITLE" ]; then CLEAN_TITLE="GitLab Push"; fi
      if [ -z "$CLEAN_MSG" ]; then CLEAN_MSG="Automated pre-publish commit"; fi

      PAYLOAD="{\"object_kind\":\"push\",\"ref\":\"$CI_COMMIT_REF_NAME\",\"checkout_sha\":\"$CI_COMMIT_SHA\",\"project\":{\"id\":\"$CI_PROJECT_ID\",\"name\":\"$CI_PROJECT_NAME\",\"path_with_namespace\":\"$CI_PROJECT_PATH\",\"web_url\":\"$CI_PROJECT_URL\"},\"commits\":[{\"id\":\"$CI_COMMIT_SHA\",\"title\":\"$CLEAN_TITLE\",\"message\":\"$CLEAN_MSG\",\"author\":{\"name\":\"$CI_COMMIT_AUTHOR\"}}]}"

      WEBHOOK_SECRET="${GITLAB_WEBHOOK_SECRET:-${BRANDSHIELD_WEBHOOK_SECRET:-brandshield-gitlab-webhook-secret-2026}}"

      set +x
      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BRANDSHIELD_URL}/api/webhooks/incoming/prepublish?orgSlug=${BRANDSHIELD_ORG_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-Gitlab-Event: Push Hook" \
        -H "X-Gitlab-Token: ${WEBHOOK_SECRET}" \
        -d "$PAYLOAD")
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      BODY=$(echo "$RESPONSE" | sed '$d')
      echo "HTTP Status: $HTTP_CODE"
      echo "Response: $BODY"
      if [ "$HTTP_CODE" -ne 200 ]; then
        echo "❌ [ERROR] BrandShield API returned failure code: $HTTP_CODE"
        exit 1
      fi
      ALLOWED=$(echo "$BODY" | grep -o '"allowed":true' || true)
      if [ -z "$ALLOWED" ]; then
        echo "🚨 [BLOCKED] Mandatory brand governance audit failed! Critical violations detected."
        exit 1
      fi
      echo "✅ [PASSED] BrandShield AI governance audit verified. Proceeding to pipeline stages."
  allow_failure: false

# ── Stage 2: Code Quality & Feature Regression Suite ──────────────────────────
unit-tests:
  stage: test
  image: oven/bun:1.2.2-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - bun install --frozen-lockfile || bun install
    - DATABASE_URL="file:./test.db" bun x prisma generate --schema prisma/schema.prisma
    - DATABASE_URL="file:./test.db" bun x prisma validate --schema prisma/schema.prisma
    - DATABASE_URL="postgresql://test:test@localhost:5432/testdb" bun x prisma validate --schema prisma/schema.postgres.prisma
    - DATABASE_URL="file:./test.db" bun x prisma db push --schema prisma/schema.prisma --skip-generate
  script:
    - bun x tsc --noEmit
    - DATABASE_URL="file:./test.db" bun scripts/verify-features.mjs

# ── Stage 3: Next.js Production Build Validation ──────────────────────────────
production-build:
  stage: build
  image: oven/bun:1.2.2-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - bun install --frozen-lockfile || bun install
    - DATABASE_URL="file:./test.db" bun x prisma generate --schema prisma/schema.prisma
  script:
    - bun run build

